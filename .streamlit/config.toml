[server]
# Só aceita conexões desta máquina. O padrão (0.0.0.0) expõe o painel para
# qualquer um na mesma rede. Em produção, o acesso externo passa por um proxy
# com HTTPS e login, nunca direto no Streamlit.
address = "127.0.0.1"
headless = true

# Proteções que já vêm ligadas por padrão; ficam explícitas para ninguém desligar sem querer
enableXsrfProtection = true
enableCORS = true

[browser]
# Não envia estatísticas de uso para os servidores do Streamlit
gatherUsageStats = false
