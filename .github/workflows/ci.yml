name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest

    # Postgres de verdade para os testes de integração (migrações): mesmas
    # credenciais e porta do docker-compose local
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: triagem
          POSTGRES_PASSWORD: triagem
          POSTGRES_DB: triagem
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U triagem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked: falha se o uv.lock não corresponder ao pyproject.toml
      - name: Instalar dependências
        run: uv sync --locked

      # Do mais barato ao mais caro: erro de estilo aparece em segundos
      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      - name: Tipos
        run: uv run mypy

      # LLM falso (sem Ollama); Postgres do service acima para os testes de integração.
      # EXIGIR_BANCO=1: sem banco, os testes de integração falham em vez de serem pulados
      - name: Testes
        run: uv run pytest
        env:
          EXIGIR_BANCO: "1"
          TESTE_DATABASE_URL: postgresql://triagem:triagem@127.0.0.1:5433/postgres
