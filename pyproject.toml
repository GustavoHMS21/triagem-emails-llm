[project]
name = "triagem"
version = "0.1.0"
description = "Triagem e classificação de e-mails da Alvorada Gestão Condominial"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.3",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# F: erros reais; E/W: estilo PEP 8; I: ordem dos imports; B: armadilhas comuns; UP: sintaxe moderna
select = ["F", "E", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
